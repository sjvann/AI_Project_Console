services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiproject
      POSTGRES_PASSWORD: aiproject
      POSTGRES_DB: aiproject_company
    ports:
      - "5432:5432"
    volumes:
      - company_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  company:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Company: Host=db;Port=5432;Database=aiproject_company;Username=aiproject;Password=aiproject
      Company__EncryptionKey: ${COMPANY_ENCRYPTION_KEY}
      Company__BootstrapOwnerGitHubLogin: ${COMPANY_OWNER_GITHUB}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"

volumes:
  company_pg:
