name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AiProject.Console.slnx

      - name: Build
        run: dotnet build AiProject.Console.slnx --no-restore -c Release

      - name: Test
        run: dotnet test AiProject.Console.slnx --no-build -c Release --verbosity minimal --nologo
